name: Streamlit Uygulamasini Uyanik Tut

on:
  schedule:
    # Her 4 saatte bir çalışır
    - cron: '0 */4 * * *'
  workflow_dispatch: 

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Tarayıcı Gibi Davranarak İstek Gönder
        run: |
          curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
               -c cookies.txt -b cookies.txt \
               -sL "https://kibtek-data-knz7c69fis449g7rtdyxwk.streamlit.app" > /dev/null
